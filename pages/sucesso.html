<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso | Music Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>

    <header style="border-bottom: 1px solid var(--border-color); background: var(--bg-color);">
        <nav class="container nav-bar">
            <div class="logo"><a href="../index.html"><img src="../assets/images/music-station-vetorizada.png" alt="Logo Music Station"></a></div>
            <ul class="menu-principal">
                <li><a href="../index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="profissionais.html">Profissionais</a></li>
                <li><a href="instrumentos.html">Instrumentos</a></li>
            </ul>
            <div class="botoes-auth"></div>
        </nav>
    </header>

    <div class="sucesso-wrapper">
        <div class="success-container">
            <div class="icon-circle">
                <i class="ph-bold ph-check-circle"></i>
            </div>
            
            <h1 id="success-title">Conta criada com sucesso!</h1>
            <p id="success-desc">Bem-vindo à Music Station. Sua conta está pronta para uso.</p>
            
            <div class="button-group">
                <a href="painel.html" class="btn-panel">Ir para o painel <i class="ph ph-arrow-right"></i></a>
                <a href="../index.html" class="btn-home">Voltar ao início</a>
            </div>
        </div>
    </div>

    <!-- Script de Auth -->
    <script src="../js/auth-simulator.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('type') === 'login') {
                document.getElementById('success-title').textContent = 'Login efetuado com sucesso!';
                document.getElementById('success-desc').textContent = 'Bem-vindo de volta ao seu espaço na Music Station.';
            }
        });
    </script>
    <script src="../js/interactions.js"></script>
</body>
</html>
